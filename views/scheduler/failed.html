{{ define "content" }}
<section class="table-components" style="padding-top: 15px; padding-left: 30px; padding-right: 30px;">
  <div class="my-3 p-3 bg-body rounded shadow-sm">
    <h6 class="border-bottom pb-2 mb-2">Failed Jobs</h6>
    <table class="table fold-table">
      <thead>
        <tr>
          <th scope="col"></th>
          <th scope="col">Id</th>
          <th scope="col">Processor</th>
          <!-- <th scope="col">Arguments</th> -->
          <th scope="col">Retry</th>
          <th scope="col">RetryCount</th>
          <th scope="col">CreatedAt</th>
          <th scope="col">Action</th>
        </tr>
      </thead>
      <tbody>
        {{range $item := .Failed }}
        <tr class="view" id="job-{{ .ID }}">
          <td>
            <div class="action toggle">
              <button class="collapsible" onclick='toggleFold(this, "job-{{ .ID }}")'>
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-plus"
                  viewBox="0 0 16 16">
                  <path
                    d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4" />
                </svg>
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-dash"
                  viewBox="0 0 16 16">
                  <path d="M4 8a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7A.5.5 0 0 1 4 8" />
                </svg>
              </button>
            </div>
          </td>
          <th scope="row">{{ .ID }}</th>
          <td>{{ .Processor }}</td>
          <!-- <td>{{ .Arguments }}</td> -->
          <td>{{ .Retry }}</td>
          <td>{{ .RetryCount }}</td>
          <td>{{ .CreatedAt.Format "2006-01-02 15:04" }}</td>
          <td>
            <div class="action">
              <button class="btn text-primary" hx-post="/scheduler/failed/retry/{{ .ID}}"
                hx-indicator="#ri-{{ .ID }}" title="Retry Job">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                  class="bi bi-arrow-clockwise" viewBox="0 0 16 16">
                  <path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2z" />
                  <path
                    d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466" />
                </svg>
              </button>
              <button class="text-danger" hx-target="#job-{{ .ID }}" hx-delete="/scheduler/failed/{{ .ID }}">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                  class="bi bi-trash-fill" viewBox="0 0 16 16">
                  <path
                    d="M2.5 1a1 1 0 0 0-1 1v1a1 1 0 0 0 1 1H3v9a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V4h.5a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H10a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1zm3 4a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 .5-.5M8 5a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7A.5.5 0 0 1 8 5m3 .5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 1 0" />
                </svg>
              </button>

              <div id="ri-{{ .ID }}" class="htmx-indicator spinner-border text-light"
                style="width: 1.3rem; height: 1.3rem;" role="status">
                <span class="visually-hidden">loading</span>
              </div>
            </div>
          </td>
        </tr>
        <tr class="fold">
          <td colspan="9">
            <div class="fold-content">
              <code>
                {{ range $line := splitNewLine .Log }}
                  {{ $line }}<br>
                {{ end }}
              </code>
            </div>
          </td>
        </tr>
        {{ end }}
      </tbody>
    </table>
  </div>
</section>

{{ end }}
