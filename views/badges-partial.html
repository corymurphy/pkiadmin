{{ block "badge-connected" . }}
<div hx-get="/ca/status/{{ .ID }}" hx-trigger="load delay:5s">
  <div class="chakra-stack css-16vr4dd">
    <span class="chakra-badge css-oqjyxw">
      <div class="chakra-stack css-18e1wj0">
        <div class="css-6jcppe">
          <div class="css-0">
            <div class="css-1xc4fct"></div>
          </div>
          <div class="css-xi606m">
            <div class="chakra-stack css-1hohgv6">
              <p style="margin:0;" class="chakra-text css-zylzbl">Connected</p>
            </div>
          </div>
        </div>
      </div>
    </span>
  </div>
</div>
{{ end }}

{{ block "badge-disconnected" . }}
<div hx-get="/ca/status/{{ .ID }}" hx-trigger="load delay:5s">
  <div class="chakra-stack css-16vr4dd">
    <span class="chakra-badge css-oqjyxw">
      <div class="chakra-stack css-18e1wj0">
        <div class="css-6jcppe">
          <div class="css-0">
            <div class="css-5dfj4m"></div>
          </div>
          <div class="css-xi606m">
            <div class="chakra-stack css-1hohgv6">
              <p style="margin:0;" class="chakra-text css-zylzbl">Disconnected</p>
            </div>
          </div>
        </div>
      </div>
    </span>
  </div>
</div>
{{ end }}

{{ block "badge-count" . }}
<span hx-get="{{ .UpdatePath }}" hx-trigger="load delay:5s" hx-swap="outerHTML"
  class="position-absolute translate-middle badge rounded-pill bg-danger">{{ .Value }}
</span>
{{ end }}
